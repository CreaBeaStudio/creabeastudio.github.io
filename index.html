<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CreaBeaStudio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5efe6; /* soft beige */
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1em;
      color: white;
      background-color: #333;
      text-decoration: none;
      border-radius: 25px;
      transition: 0.3s;
    }

    a.button:hover {
      background-color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
     <img src="Logo_Full.png" alt="CreaBea Studio logo" style="width:300px; margin-bottom:20px;">
    <h1>CreaBea Studio 🎨</h1>
    
    <p>We are currently working on something exciting!</p>

    <a class="button" href="https://www.etsy.com/shop/YOURSHOPNAME" target="_blank">
      Visit our Etsy Shop
    </a>
  </div>
</body>
</html>
